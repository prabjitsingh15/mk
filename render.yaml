services:
  - type: web
    name: bareaya-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bareaya-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: MAIL_USER
        sync: false
      - key: MAIL_APP_PASSWORD
        sync: false
      - key: NOTIFICATION_EMAIL
        sync: false

databases:
  - name: bareaya-db
    databaseName: bareaya
    user: bareaya
    plan: free
